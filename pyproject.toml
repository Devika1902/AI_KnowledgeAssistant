[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Grounded document Q&A prototype with citations and abstention"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "python-dotenv>=1.0"]

[project.optional-dependencies]
app = ["streamlit>=1.32", "requests>=2.31", "pymupdf>=1.24"]
semantic = ["sentence-transformers>=2.6", "numpy>=1.26"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["knowledge_assistant*"]
